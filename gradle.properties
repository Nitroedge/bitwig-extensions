org.gradle.configuration-cache=true

# bitwigExtensionsDir has no safe default: it names a user- and
# platform-specific Bitwig Studio Extensions directory. Supply it
# explicitly on every build, e.g.:
#   ./gradlew :secondo:shadowJar -PbitwigExtensionsDir=/path/to/Bitwig/Extensions
# or set it in an uncommitted local gradle.properties. Omitting it now
# fails the build with a clear missing-property error instead of
# silently writing the packaged extension into the wrong directory.
