<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bitwig Pal — API Reference</title>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.48.7"></script>
  <script>
    // Determine spec URL: use /openapi.json when served by the extension,
    // fall back to the local file when opened as a static page.
    const isServed = window.location.port === '8787';
    const specUrl = isServed ? '/openapi.json' : 'openapi.json';

    Scalar.createApiReference('#app', {
      url: specUrl,
      theme: 'kepler',
      layout: 'modern',
      hideClientButton: false,
      defaultHttpClient: {
        targetKey: 'shell',
        clientKey: 'curl',
      },
      servers: [
        {
          url: 'http://localhost:8787',
          description: 'Local Bitwig Studio',
        },
      ],
      metadata: {
        title: 'Bitwig Pal API',
      },
    });
  </script>
</body>
</html>
